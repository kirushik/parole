[package]
name = "parole"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A read-only reviewer for sandbox-written git refs (refs/jail/*, refs/devvm/*), built on Rune."

[dependencies]
# Rune is pre-release: pin a rev of `dev`.
rune = { git = "https://github.com/anomalyco/rune", rev = "00cca3c7ab1ef6193b2a243a339240d8eb291da6" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "00cca3c7ab1ef6193b2a243a339240d8eb291da6" }

[profile.dev.package."*"]
opt-level = 2
debug = false
